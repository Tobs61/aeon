app-id: com.kael.aeon
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: aeon

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=xdg-documents
  - --filesystem=xdg-download

modules:
  - name: aeon
    buildsystem: simple
    build-commands:
      - ar x aeon_0.1.16_amd64.deb || ar x Aeon_0.1.16_amd64.deb
      - tar -xf data.tar.* -C /
      - mkdir -p /app/bin /app/share/applications /app/share/icons
      - mv /usr/bin/aeon /app/bin/aeon
      - cp -r /usr/share/icons/hicolor /app/share/icons/
      - '[ -f /usr/share/applications/aeon.desktop ] && DESK=/usr/share/applications/aeon.desktop || DESK=/usr/share/applications/Aeon.desktop; install -Dm644 "$DESK" /app/share/applications/com.kael.aeon.desktop'
      - desktop-file-edit --set-icon=com.kael.aeon /app/share/applications/com.kael.aeon.desktop
      - for f in /app/share/icons/hicolor/*/apps/aeon.*; do [ -e "$f" ] && mv "$f" "${f%/*}/com.kael.aeon.${f##*.}"; done
    sources:
      - type: file
        path: src-tauri/target/release/bundle/deb/aeon_0.1.16_amd64.deb
